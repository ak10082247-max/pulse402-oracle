services:
  - type: web
    name: pulse402-oracle
    runtime: docker
    region: oregon
    plan: starter
    autoDeploy: true
    envVars:
      - key: PORT
        value: 10000
      - key: PAYOUT_WALLET_ADDRESS
        value: 0x80E0Ae84679b7f11bE171DaADd492FBECf628cd6
      - key: BASE_RPC_URL
        value: https://mainnet.base.org
      - key: SOLANA_MERCHANT_ADDRESS
        value: 9wuMysgXwNhtQeqJgGByAiMYc4EjzZ5wUSmnjrrt3ffh
      - key: PULSE_PAYMENTS_DB
        value: /app/state/payments.sqlite3
    # Existing manually attached, approved 1GB disk mounts /app/state.
    # Preserve that disk when importing this service into a Blueprint.
