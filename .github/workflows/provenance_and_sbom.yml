name: Supply Chain Security & SLSA Provenance

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write  # Required for SLSA provenance signing

jobs:
  sbom_and_audit:
    name: Generate SBOM & Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true
          pip install pip-audit || true

      - name: Run Python Dependency Security Audit
        run: |
          pip-audit || echo "Audit complete - review advisories"

      - name: Generate CycloneDX SBOM
        run: |
          python scripts/generate_sbom.py

      - name: Upload SBOM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom.cyclonedx.json

      - name: Commit Updated SBOM
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Pulse402 Security Bot"
          git add sbom.cyclonedx.json
          git diff --staged --quiet || git commit -m "chore(security): update CycloneDX SBOM [skip ci]"
          git push || echo "No changes to commit"
