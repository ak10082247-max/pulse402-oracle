name: Pulse402 24/7 Keepalive & Freshness Validator

on:
  schedule:
    - cron: '*/5 * * * *'  # Runs every 5 minutes
  workflow_dispatch:

jobs:
  ping_and_validate:
    runs-on: ubuntu-latest
    steps:
      - name: Warm Health & Verify Engine
        run: |
          echo "Pinging Pulse402 Oracle /health..."
          HEALTH=$(curl -s --max-time 10 https://pulse402-oracle.onrender.com/health || echo '{"status":"offline"}')
          echo "Health response: $HEALTH"

          echo "Pinging Pulse402 MCP initialize..."
          MCP_INIT=$(curl -s -X POST https://pulse402-oracle.onrender.com/mcp \
            -H "Content-Type: application/json" \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"keepalive-probe","version":"1.0"}}}' \
            || echo '{"error":"offline"}')
          echo "MCP response: $MCP_INIT"

          echo "Pinging Cloudflare Edge Worker..."
          CF_HEALTH=$(curl -s --max-time 10 https://pulse402-oracle.ak10082247.workers.dev/health || echo '{"status":"edge_offline"}')
          echo "Cloudflare Edge response: $CF_HEALTH"
