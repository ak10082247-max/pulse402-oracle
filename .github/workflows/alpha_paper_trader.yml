name: Pulse402 Continuous Alpha Paper Trader

on:
  schedule:
    - cron: '17 * * * *'  # Runs hourly at minute 17
  workflow_dispatch:

permissions:
  contents: write

jobs:
  paper_trade:
    name: Run Alpha Scan & Record Simulated PnL
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true

      - name: Execute Alpha Scan & Paper Trade Cycle
        run: |
          python trading/pulse_alpha_trader.py --once

      - name: Commit Updated Trading Journal
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Pulse402 Alpha Trader"
          git add data/trading_journal.json
          git diff --staged --quiet || git commit -m "chore(trading): record simulated alpha trade cycle [skip ci]"
          git push || echo "No trading updates to push"
