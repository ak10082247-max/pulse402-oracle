name: Pulse402 Autonomous Growth Engine & Scorecard

on:
  schedule:
    - cron: '0 */6 * * *'  # Runs every 6 hours
  workflow_dispatch:

permissions:
  contents: write

jobs:
  growth_and_scorecard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_PAT || github.token }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true

      - name: Run Autonomous Growth Engine
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_PAT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: |
          python scripts/autonomous_growth_engine.py --limit 5 --max-daily 20

      - name: Run Daily Revenue Scorecard
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: |
          python scripts/daily_revenue_scorecard.py

      - name: Commit Contacted Leads
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Pulse402 Growth Bot"
          git add data/contacted_leads.json
          git diff --staged --quiet || git commit -m "Update contacted leads [skip ci]"
          git push || echo "No changes to commit or push"
